name: docs-consistency

# Fails a push/PR whose markdown links have rotted — here or against the
# sibling hardware repo. Runs no matter which chat committed the change.
on:
  push:
    branches: [main]
    paths: ['**.md', 'tools/check_docs.py', '.github/workflows/docs-consistency.yml']
  pull_request:
    paths: ['**.md', 'tools/check_docs.py']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the sibling (hardware) repo
        uses: actions/checkout@v4
        with:
          repository: anton-vinogradov/esp32-leshy2
          path: .sibling
      - name: Check doc cross-references
        run: python3 tools/check_docs.py --sibling-path .sibling

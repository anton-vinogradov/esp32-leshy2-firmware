name: docsync
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docsync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out firmware repo
        uses: actions/checkout@v4
      - name: Clone hardware repo (canonical checker + sync-map)
        run: git clone --depth 1 https://github.com/anton-vinogradov/esp32-leshy2 hw
      - name: Check doc sync (links + canonical tripwire)
        run: python3 hw/tools/docsync/check.py --repo esp32-leshy2=hw --repo esp32-leshy2-firmware=.
